name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare Web Assets
        run: node scripts/prepare-ios.js

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Fix Scene Delegate
        run: node scripts/fix-scene-delegate.js

      - name: Build iOS xcarchive
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          echo "Building using target: $TARGET_ARG"

          xcodebuild archive \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .IPA from xcarchive
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in archive"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MusicFlow.ipa Payload
          cd ..
          echo "IPA Created successfully at build/MusicFlow.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-iOS-IPA
          path: build/MusicFlow.ipa
          retention-days: 14
